name: CI

on:
  push:
    branches:
      - main
      - workspace/**
  pull_request:

jobs:
  backend-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt -r requirements/backend.txt -r requirements/evaluator.txt -r requirements/rl.txt -r requirements/dev.txt

      - name: Run pytest
        env:
          EVALUATOR_MOCK_MODE: '1'
        run: pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build
